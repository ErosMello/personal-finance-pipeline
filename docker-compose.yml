services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance}
      POSTGRES_USER: ${POSTGRES_USER:-finance_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      FINANCE_APP_PASSWORD: ${FINANCE_APP_PASSWORD:?Defina FINANCE_APP_PASSWORD}
      FINANCE_BI_PASSWORD: ${FINANCE_BI_PASSWORD:?Defina FINANCE_BI_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    networks: [internal]
    security_opt: ["no-new-privileges:true"]

  n8n:
    image: n8nio/n8n:2.4.4
    restart: unless-stopped
    depends_on: [postgres]
    environment:
      DB_TYPE: sqlite
      DB_SQLITE_DATABASE: /home/node/.n8n/database.sqlite
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Defina N8N_ENCRYPTION_KEY}
      LLM_API_KEY: ${LLM_API_KEY:?Defina LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8080}
      LLM_MODEL: ${LLM_MODEL:-categorizador}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /data/pdfs
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ${PDF_DIRECTORY:-./samples}:/data/pdfs:ro
    ports:
      - "127.0.0.1:${N8N_PORT:-5679}:5678"
    networks: [internal]
    security_opt: ["no-new-privileges:true"]

  llm:
    # Imagem fixada pelo digest de ghcr.io/ggml-org/llama.cpp:server.
    image: ghcr.io/ggml-org/llama.cpp@sha256:8c74db29f1a2bef3f0a331b52c4d6214601dfceed4bee0b94cc48b3b23ff257d
    restart: unless-stopped
    command: >
      -m /models/${MODEL_FILE:-Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
      -ngl 0 -t 6 -c 8192 -np 1 --reasoning off
      --host 0.0.0.0 --port 8080
      --api-key-file /run/secrets/llama_key
      --alias categorizador
    volumes:
      - ${MODEL_DIRECTORY:-./models}:/models:ro
    secrets:
      - llama_key
    networks: [internal]
    security_opt: ["no-new-privileges:true"]

secrets:
  llama_key:
    file: ${LLM_API_KEY_FILE:-./secrets/llama_key}

volumes:
  pgdata:
  n8n_data:

networks:
  internal:
